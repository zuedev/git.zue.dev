name: Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cgit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cgit
          push: true
          tags: ghcr.io/${{ github.repository }}/cgit:latest

      - name: Build and push debian image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          push: true
          tags: ghcr.io/${{ github.repository }}/debian:latest
