services:
  debian:
    build:
      context: .
      dockerfile: Dockerfile.debian
    environment:
      AUTHORIZED_KEYS: |
        ssh-rsa  zuedev
    ports:
      - "2222:22"
    volumes:
      - ./repositories:/repositories
  
  cgit:
    build:
      context: .
      dockerfile: Dockerfile.cgit
    develop:
      watch:
        - action: sync+restart
          path: ./cgitrc
          target: /etc/cgitrc
        - action: sync+restart
          path: ./root-readme.html
          target: /root-readme.html
        - action: sync+restart
          path: ./header.html
          target: /header.html
    ports:
      - "8080:80"
    volumes:
      - ./repositories:/srv/git:ro